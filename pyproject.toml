[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsav_canlib"
version = "0.1.0"
description = "CAN bus library for the FSAE vehicle"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "python-can>=4.2",   # interface= keyword needs 4.2+
]

[tool.setuptools.packages.find]
where = ["src"]
